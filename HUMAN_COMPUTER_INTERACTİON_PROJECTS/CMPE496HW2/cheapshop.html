<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheap Shop Catalog Store</title>
    <style>
        body {
            font-family: Tahoma, Verdana, Segoe UI, sans-serif;
            background: #eaeaea;
            margin: 0;
            padding: 0;
        }
        .main-container {
            max-width: 700px;
            margin: 40px auto;
            background: #f3f3f3;
            border: 2px solid #3a6ea5;
            border-radius: 8px;
            box-shadow: 0 4px 16px #0002;
            padding: 24px 32px 32px 32px;
        }
        h1 {
            font-size: 1.4em;
            color: #1a237e;
            margin-bottom: 18px;
            text-shadow: 1px 1px 0 #fff;
        }
        fieldset {
            border: 2px solid #3a6ea5;
            border-radius: 6px;
            margin-bottom: 18px;
            background: #e0e6f8;
            padding: 18px 18px 10px 18px;
        }
        legend {
            font-weight: bold;
            color: #1a237e;
            padding: 0 8px;
            font-size: 1.1em;
        }
        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .form-row label {
            min-width: 110px;
            margin-right: 6px;
            font-size: 1em;
        }
        .form-row input[type="text"],
        .form-row input[type="number"] {
            flex: 1;
            padding: 3px 6px;
            font-size: 1em;
            border: 1px solid #888;
            border-radius: 3px;
            background: #fff;
            margin-right: 12px;
        }
        .form-row input[type="number"] {
            max-width: 60px;
        }
        .form-row input[readonly] {
            background: #f5f5f5;
            color: #333;
        }
        .form-row .wide {
            flex: 3;
        }
        .button-row {
            display: flex;
            gap: 18px;
            margin-top: 18px;
            justify-content: flex-end;
        }
        button {
            font-family: Tahoma, Verdana, Segoe UI, sans-serif;
            font-size: 1em;
            padding: 10px 28px;
            border: 2px solid #3a6ea5;
            border-radius: 6px;
            background: linear-gradient(to bottom, #f8fafc 0%, #dbeafe 100%);
            color: #1a237e;
            font-weight: bold;
            box-shadow: 1px 1px 0 #fff;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }
        button:hover {
            background: #c3dafe;
            box-shadow: 0 2px 8px #3a6ea533;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.3);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #f3f3f3;
            border: 2px solid #3a6ea5;
            border-radius: 8px;
            padding: 24px 32px;
            min-width: 340px;
            max-width: 90vw;
            box-shadow: 0 8px 32px #0003;
        }
        .modal-content h2 {
            color: #1a237e;
            margin-bottom: 12px;
        }
        .modal-content pre {
            background: #e0e6f8;
            border-radius: 4px;
            padding: 10px;
            font-size: 1em;
            overflow-x: auto;
        }
        .modal-content .close-btn {
            margin-top: 18px;
            float: right;
        }
        @media (max-width: 600px) {
            .main-container { padding: 8px; }
            fieldset { padding: 8px; }
        }
    </style>
</head>
<body>
<div class="main-container">
    <h1>Cheap Shop Catalog Store</h1>
    <form id="catalogForm" autocomplete="off">
        <fieldset id="purchaserFieldset">
            <legend>Purchaser</legend>
            <div class="form-row">
                <label for="name">Name:</label>
                <input type="text" id="name" required>
                <label for="phone">Phone:</label>
                <input type="text" id="phone" required>
            </div>
            <div class="form-row">
                <label for="postal">Postal Code:</label>
                <input type="text" id="postal" required>
                <label for="province">Province:</label>
                <input type="text" id="province" required>
                <label for="city">City:</label>
                <input type="text" id="city" required>
            </div>
            <div class="form-row">
                <label for="address">Delivery Address:</label>
                <input type="text" id="address" class="wide" required>
            </div>
            <div class="form-row">
                <label for="date">Today's date:</label>
                <input type="text" id="date" required>
                <label for="cc">Credit Card No.:</label>
                <input type="text" id="cc" required>
                <label for="validation">for dept use: validation id:</label>
                <input type="text" id="validation">
            </div>
        </fieldset>
        <fieldset>
            <legend>Catalog Item</legend>
            <div class="form-row">
                <label for="itemNumber">Number:</label>
                <input type="text" id="itemNumber" required>
                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" min="1" value="1" required>
                <label for="cost">Cost/item:</label>
                <input type="number" id="cost" min="0" step="0.01" required>
                <label for="total">Total:</label>
                <input type="text" id="total" readonly>
            </div>
            <div class="form-row">
                <label for="balance">Balance Owing:</label>
                <input type="text" id="balance" readonly>
            </div>
            <div class="button-row">
                <button type="button" id="nextBtn">Next Catalog Item (PF5)</button>
                <button type="button" id="invoiceBtn">Trigger Invoice (PF8)</button>
            </div>
        </fieldset>
    </form>
</div>
<div class="modal" id="invoiceModal">
    <div class="modal-content">
        <h2>Invoice Summary</h2>
        <pre id="invoiceText"></pre>
        <button class="close-btn" id="closeModalBtn">Close</button>
    </div>
</div>
<script>
// State
let items = [];
let balanceOwing = 0;
let purchaserEntered = false;

function updateTotal() {
    const qty = parseInt(document.getElementById('quantity').value) || 0;
    const cost = parseFloat(document.getElementById('cost').value) || 0;
    document.getElementById('total').value = qty && cost ? (qty * cost).toFixed(2) : '';
}
function updateBalance() {
    document.getElementById('balance').value = balanceOwing.toFixed(2);
}
function clearItemFields() {
    document.getElementById('itemNumber').value = '';
    document.getElementById('quantity').value = 1;
    document.getElementById('cost').value = '';
    document.getElementById('total').value = '';
}
function addCatalogItem() {
    const num = document.getElementById('itemNumber').value.trim();
    const qty = parseInt(document.getElementById('quantity').value);
    const cost = parseFloat(document.getElementById('cost').value);
    if (!num || !qty || !cost) {
        alert('Please fill in item number, quantity, and cost.');
        return;
    }
    const total = qty * cost;
    items.push({ number: num, quantity: qty, costPerItem: cost, total });
    balanceOwing += total;
    updateBalance();
    clearItemFields();
    if (!purchaserEntered) {
        purchaserEntered = true;
        document.getElementById('purchaserFieldset').style.display = 'none';
    }
}
function triggerInvoice() {
    if (items.length === 0) {
        alert('No items entered.');
        return;
    }
    let sb = '';
    if (purchaserEntered) {
        sb += 'Name: ' + document.getElementById('name').value + '\n';
        sb += 'Phone: ' + document.getElementById('phone').value + '\n';
        sb += 'Address: ' + document.getElementById('address').value + '\n';
        sb += 'Date: ' + document.getElementById('date').value + '\n';
        sb += 'Credit Card: ' + document.getElementById('cc').value + '\n';
        sb += 'Validation ID: ' + document.getElementById('validation').value + '\n\n';
    } else {
        sb += '(No purchaser info entered)\n';
    }
    sb += 'Items:\n';
    for (const item of items) {
        sb += `  #${item.number}  Qty:${item.quantity}  Cost:${item.costPerItem.toFixed(2)}  Total:${item.total.toFixed(2)}\n`;
    }
    sb += '\nBalance Owing: $' + balanceOwing.toFixed(2);
    document.getElementById('invoiceText').textContent = sb;
    document.getElementById('invoiceModal').style.display = 'flex';
}
function resetForm() {
    document.getElementById('catalogForm').reset();
    document.getElementById('purchaserFieldset').style.display = '';
    items = [];
    balanceOwing = 0;
    purchaserEntered = false;
    updateBalance();
    clearItemFields();
}
// Event listeners
['quantity', 'cost'].forEach(id => {
    document.getElementById(id).addEventListener('input', updateTotal);
});
document.getElementById('nextBtn').addEventListener('click', addCatalogItem);
document.getElementById('invoiceBtn').addEventListener('click', function() {
    triggerInvoice();
});
document.getElementById('closeModalBtn').addEventListener('click', function() {
    document.getElementById('invoiceModal').style.display = 'none';
    resetForm();
});
// Initialize
updateBalance();
</script>
</body>
</html>
