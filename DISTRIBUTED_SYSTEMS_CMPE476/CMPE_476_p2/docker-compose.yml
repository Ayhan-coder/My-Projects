version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    restart: unless-stopped

  app1:
    build: ./app
    environment:
      - SERVER_ID=app1
    depends_on:
      - redis
    restart: unless-stopped

  app2:
    build: ./app
    environment:
      - SERVER_ID=app2
    depends_on:
      - redis
    restart: unless-stopped

  app3:
    build: ./app
    environment:
      - SERVER_ID=app3
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    restart: unless-stopped
